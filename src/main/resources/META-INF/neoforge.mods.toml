modLoader="javafml"
loaderVersion="${neoforgeLoaderVersionRange}"
license="MIT"

[[mods]]
modId="${modId}"
version="${version}"
displayName="${modName}"
displayTest="IGNORE_SERVER_VERSION"
iconFile="jiv-icon.png"
